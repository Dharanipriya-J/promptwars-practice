name: PitchPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Coverage (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated test suite with coverage
        env:
          GEMINI_API_KEY: "ci-mock-key-not-used"
          STAFF_SECRET_TOKEN: "fifa-staff-secure-2026"
          ALLOWED_ORIGIN: "http://localhost:8000"
        run: python3 -m pytest tests/ -v --cov=src --cov=services --cov-report=term-missing

  lint:
    name: Ruff Quality & Security Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ services/ tests/
