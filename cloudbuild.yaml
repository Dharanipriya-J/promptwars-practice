# Cloud Build configuration for Cloud Run deployment
# Usage: gcloud builds submit --config cloudbuild.yaml .
steps:
  # Step 1: Run tests
  - name: 'python:3.13-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install -r requirements.txt --quiet
        python3 tests/test_stadium_ops.py
    env:
      - 'GEMINI_API_KEY=$$GEMINI_API_KEY'
      - 'STAFF_SECRET_TOKEN=ci-test-staff-token-32-chars-long'
    secretEnv: ['GEMINI_API_KEY']

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pitchpulse:$COMMIT_SHA', '.']

  # Step 3: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pitchpulse:$COMMIT_SHA']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pitchpulse'
      - '--image=gcr.io/$PROJECT_ID/pitchpulse:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--set-env-vars=ENVIRONMENT=production'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,STAFF_SECRET_TOKEN=STAFF_SECRET_TOKEN:latest'

images:
  - 'gcr.io/$PROJECT_ID/pitchpulse:$COMMIT_SHA'

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest'
      env: 'GEMINI_API_KEY'
    - versionName: 'projects/$PROJECT_ID/secrets/STAFF_SECRET_TOKEN/versions/latest'
      env: 'STAFF_SECRET_TOKEN'

timeout: '1200s'
