line-length = 120
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line length
    "S101",   # allow assert in tests
    "S106",   # allow hardcoded password in test fixtures
    "B008",   # allow Depends in route parameters
    "RUF012", # mutable class attributes in Pydantic/dataclass
    "UP042",  # allow (str, Enum) pattern for Pydantic serialization
]

[lint.per-file-ignores]
"tests/*" = ["E501", "S", "N", "ANN"]
