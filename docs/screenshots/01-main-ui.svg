<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD200"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="80" cy="65" r="18" fill="url(#greenGlow)"/>
  <text x="80" y="72" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#080C14" text-anchor="middle">⚡</text>
  <text x="115" y="72" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">PITCHPULSE 2026 // <tspan fill="#00FF87">FIFA World Cup Hub</tspan></text>
  
  <!-- Live Status Badge -->
  <rect x="940" y="48" width="190" height="34" rx="17" fill="#00FF87" fill-opacity="0.12" stroke="#00FF87" stroke-width="1"/>
  <circle cx="960" cy="65" r="5" fill="#00FF87"/>
  <text x="975" y="71" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#00FF87">STADIUM LIVE • MATCHDAY</text>

  <!-- Metric 1: Crowd Density (Neon Green) -->
  <rect x="40" y="125" width="260" height="110" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="65" y="160" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#94A3B8">AVERAGE GATE DENSITY</text>
  <text x="65" y="205" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#00FF87">38% <tspan font-size="16" fill="#94A3B8" font-weight="500">Flow Smooth</tspan></text>

  <!-- Metric 2: Accessible Routes (Sunshine Yellow) -->
  <rect x="325" y="125" width="260" height="110" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="350" y="160" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#94A3B8">ACCESSIBLE RAMPS ACTIVE</text>
  <text x="350" y="205" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#FFD200">100% <tspan font-size="16" fill="#94A3B8" font-weight="500">Step-Free</tspan></text>

  <!-- Metric 3: Active Incidents (Electric Red) -->
  <rect x="610" y="125" width="260" height="110" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="635" y="160" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#94A3B8">CRITICAL BOTTLENECK ALERTS</text>
  <text x="635" y="205" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#FF2A55">0 <tspan font-size="16" fill="#94A3B8" font-weight="500">All Gates Green</tspan></text>

  <!-- Metric 4: AI Model Latency -->
  <rect x="895" y="125" width="265" height="110" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="920" y="160" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#94A3B8">GEMINI 2.5 INFERENCE</text>
  <text x="920" y="205" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#38BDF8">14ms <tspan font-size="16" fill="#94A3B8" font-weight="500">Real-Time</tspan></text>

  <!-- Main Wayfinding & Operations Panel -->
  <rect x="40" y="260" width="730" height="380" rx="20" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="70" y="305" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">🏟️ Dynamic Stadium Gate Telemetry & Crowd Flow</text>
  
  <!-- Gate Row 1 -->
  <rect x="70" y="330" width="670" height="60" rx="12" fill="#1A243B"/>
  <text x="95" y="366" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">Gate A (North Concourse Plaza)</text>
  <rect x="450" y="347" width="130" height="26" rx="13" fill="#00FF87" fill-opacity="0.15"/>
  <text x="515" y="364" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#00FF87" text-anchor="middle">Wait: 4 mins • 42%</text>
  <rect x="600" y="347" width="120" height="26" rx="13" fill="#38BDF8" fill-opacity="0.15"/>
  <text x="660" y="364" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#38BDF8" text-anchor="middle">♿ Step-Free Ramp</text>

  <!-- Gate Row 2 -->
  <rect x="70" y="405" width="670" height="60" rx="12" fill="#1A243B"/>
  <text x="95" y="441" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">Gate B (East Accessible Boulevard)</text>
  <rect x="450" y="422" width="130" height="26" rx="13" fill="#00FF87" fill-opacity="0.15"/>
  <text x="515" y="439" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#00FF87" text-anchor="middle">Wait: 2 mins • 28%</text>
  <rect x="600" y="422" width="120" height="26" rx="13" fill="#38BDF8" fill-opacity="0.15"/>
  <text x="660" y="439" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#38BDF8" text-anchor="middle">♿ Priority Entry</text>

  <!-- Gate Row 3 -->
  <rect x="70" y="480" width="670" height="60" rx="12" fill="#1A243B"/>
  <text x="95" y="516" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">Gate C (South Transit Plaza)</text>
  <rect x="450" y="497" width="130" height="26" rx="13" fill="#FFD200" fill-opacity="0.15"/>
  <text x="515" y="514" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFD200" text-anchor="middle">Wait: 14 mins • 78%</text>
  <rect x="600" y="497" width="120" height="26" rx="13" fill="#FF2A55" fill-opacity="0.15"/>
  <text x="660" y="514" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FF2A55" text-anchor="middle">⚠️ High Surge</text>

  <!-- Gate Row 4 -->
  <rect x="70" y="555" width="670" height="60" rx="12" fill="#1A243B"/>
  <text x="95" y="591" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">Gate D (West Shuttle Boulevard)</text>
  <rect x="450" y="572" width="130" height="26" rx="13" fill="#00FF87" fill-opacity="0.15"/>
  <text x="515" y="589" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#00FF87" text-anchor="middle">Wait: 3 mins • 35%</text>
  <rect x="600" y="572" width="120" height="26" rx="13" fill="#38BDF8" fill-opacity="0.15"/>
  <text x="660" y="589" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#38BDF8" text-anchor="middle">♿ Step-Free Ramp</text>

  <!-- Right Side Assistant Feed -->
  <rect x="795" y="260" width="365" height="380" rx="20" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="825" y="305" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">🤖 Gemini Multilingual Assistant</text>
  
  <rect x="825" y="330" width="305" height="85" rx="12" fill="#1A243B"/>
  <text x="840" y="358" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#38BDF8">USER (Section 104 • Spanish)</text>
  <text x="840" y="385" font-family="system-ui, sans-serif" font-size="13" fill="#E2E8F0">¿Dónde está la sala sensorial tranquila?</text>

  <rect x="825" y="430" width="305" height="120" rx="12" fill="#0A101E" stroke="#00FF87" stroke-width="1"/>
  <text x="840" y="458" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#00FF87">PITCHPULSE AI (Gemini 2.5 Flash)</text>
  <text x="840" y="485" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">La Suite Sensorial #2 está en el Nivel 2</text>
  <text x="840" y="505" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">este del vestíbulo. Ruta sin escalones</text>
  <text x="840" y="525" font-family="system-ui, sans-serif" font-size="12" fill="#00FF87">vía Ascensor Torre 2 habilitada.</text>
  
  <rect x="825" y="570" width="305" height="45" rx="10" fill="url(#greenGlow)"/>
  <text x="977" y="598" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#080C14" text-anchor="middle">Ask Voice / Text Query</text>
</svg>
